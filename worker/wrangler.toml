name = "dida-clone-sync"
main = "src/index.ts"
# 注意：本地 wrangler dev 的 workerd 二进制最高支持 2026-09-10；线上不受影响
compatibility_date = "2026-09-10"
workers_dev = true

# 部署后请与实际地址一致（better-auth baseURL / CORS 白名单用）
[vars]
APP_URL = "https://dida-clone-sync.royal-silence-b1e6.workers.dev"
# 如需关闭开放注册：wrangler.toml 里加 DISABLE_SIGNUPS = "true"
# 管理员邮箱用 secret 更安全：npx wrangler secret put ADMIN_EMAIL

# 后台管理 SaaS（独立 SPA）以静态资产形式托管在同一 Worker 的 /admin 路径下
# 部署前先构建：npm run build:admin（见 package.json scripts）
[assets]
directory = "./public/admin"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dida-clone-db"
database_id = "b27b26cf-c9dc-4aed-a898-cf46026ed817"

# 部署后需要设置的 secret：
#   printf '%s' '强随机串' | npx wrangler secret put BETTER_AUTH_SECRET
#   printf '%s' 'you@example.com' | npx wrangler secret put ADMIN_EMAIL
